# Chequeo automático en cada push y pull request: tests, lint, formato y build.
# Si algo falla, GitHub lo marca con una cruz roja en el commit.
name: Chequeo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Formato
        run: npm run formato:revisar
      - name: Tests
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run formato:revisar
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Formato
        run: npm run formato:revisar
      # compila la app (versión web) para detectar errores; los datos de conexión son de mentira
      - name: Build
        run: npm run compilar
        env:
          EXPO_OFFLINE: 1
          EXPO_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ejemplo
